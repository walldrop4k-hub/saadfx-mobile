name: Build SAADFX Mobile
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Find the app file
        run: '[ -f index.html ] || mv "$(ls *.html | head -1)" index.html'
      - name: Make the Android project
        run: |
          node setup.js pre
          npm install
          npx cap add android
          node setup.js android
          npx cap sync android
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SAADFX-Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SAADFX-Mobile-Android-APK
          path: SAADFX-Mobile.apk
  iphone:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find the app file
        run: '[ -f index.html ] || mv "$(ls *.html | head -1)" index.html'
      - name: Make the iPhone project
        run: |
          node setup.js pre
          npm install
          npx cap add ios
          node setup.js ios
          npx cap sync ios
      - name: Build the IPA (unsigned, for Sideloadly)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/SAADFX-Mobile.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SAADFX-Mobile-iPhone-IPA
          path: SAADFX-Mobile.ipa
